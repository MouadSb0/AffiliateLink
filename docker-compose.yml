services:
  postgres:
    image: postgres:16-alpine
    container_name: affiliatelink-postgres
    environment:
      POSTGRES_DB: affiliatelink
      POSTGRES_USER: affiliatelink
      POSTGRES_PASSWORD: affiliatelink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliatelink -d affiliatelink"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
