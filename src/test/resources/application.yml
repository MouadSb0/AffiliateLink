spring:
  # Désactive Docker Compose pendant les tests automatisés
  docker:
    compose:
      enabled: false

  # Base de données de test en mémoire (H2 en mode compatibilité PostgreSQL)
  datasource:
    url: jdbc:h2:mem:affiliatelink_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  # Flyway exécute le script V1 sur H2 pour garantir la validation du schéma
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Hibernate valide que les entités correspondent au schéma généré par Flyway
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
